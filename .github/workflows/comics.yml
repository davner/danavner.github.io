name: Comics

# The comics are committed rather than fetched in the browser, for the same
# reasons as the record collection.
#
# The site's standing promise is that nothing phones home except the GoatCounter
# beacon, which `tests/links.spec.ts` asserts on every run, and a live call to
# League of Comic Geeks from the page would break it. The cover art is their CDN,
# not ours to lean on. And there is no API here at all - `scripts/update-comics.mjs`
# parses the same HTML the site's own front end asks for, which is not something
# to do from a visitor's browser even if the promise allowed it.
#
# So this job is the only thing that talks to League of Comic Geeks: nightly, it
# reads the collection, the pull list, and the wish list, writes
# `src/content/comics.json`, and commits the covers it had to download. A failed
# read commits nothing, so the last good payload stays and keeps showing. The
# push triggers the normal deploy; this runs on a schedule, not on push, so its
# own commit never re-triggers it.
#
# ## The 403s, and what actually fixed them
#
# This ran for a while getting nothing but 403s. League of Comic Geeks is behind
# Cloudflare, which scores how the client looks and where it is calling from, and
# a runner's datacenter address is a poor start on the second. The obvious
# conclusion - that the address was the whole story and no client change could
# help - was wrong.
#
# `impit`'s `browser: "chrome"` alias resolves to Chrome 124, from early 2024,
# and sends a matching two-year-old user agent. From a home connection that is
# fine; every profile impit offers is answered 200 there. From a datacenter
# address, where the score is already marginal, it was the signal that tipped it.
# Pinning a current profile was enough, and the job has worked since.
#
# So: **keep the pinned profile current**. It is load-bearing, not cosmetic.
# Bump `browser:` in `scripts/update-comics.mjs` when impit ships a newer one -
# the whole reason this broke is that a pinned-by-default profile aged out.
#
# If it does start failing again, the script retries a 403 three times and then
# exits non-zero, so it fails visibly rather than committing nothing and going
# green. Running `node scripts/update-comics.mjs` from a home connection still
# works and is the fallback.
#
# ## The 403s came back (2026-08-24), and this time no client change helps
#
# After months of green, every run since 2026-08-24 has been 403 again - and
# this time the profile story does not apply. The responses from the runner
# carry no `cf-mitigated: challenge` header and no challenge script; they are
# the site's own branded "Restricted" block page, served straight from the
# Cloudflare edge (`server-timing: cfOrigin;dur=0` - the origin is never
# asked), with no cookie issued. The homepage is refused the same way as the
# data endpoints. That is a hard block rule - by the look of it on the
# runners' cloud address range - not a score that a better fingerprint can
# nudge.
#
# Established from CI on 2026-08-27, one dispatch per variation, all refused
# identically: chrome151 on impit 0.14.4, firefox144 (a different TLS stack),
# a cookie jar with a homepage warm-up plus realistic Referer and
# Accept-Language (no cookie is ever handed out to carry), forced HTTP/3
# (QUIC never connects from a runner; the request times out), an XHR-shaped
# request straight at the get_comics endpoint the way the site's own front
# end calls it (X-Requested-With, Sec-Fetch-* cors/empty, JSON Accept),
# X-Forwarded-For/X-Real-IP set to a residential address, and an honest
# self-identifying User-Agent - the bare site URL and a polite-crawler form
# with contact details - over the chrome151 handshake. impit's remaining
# profile families rule themselves out from home: ios18 fails the site's TLS
# handshake from anywhere and okhttp is 403 even from a home address, and
# impit exposes no HTTP/1.1 pin to test that transport alone. The same script
# read the full shelf from a home connection the same day, old profile and
# new. A rule that never issues a challenge offers nothing to pass, so the
# only lever left is where the request comes from: a non-datacenter egress
# (a self-hosted runner or tailnet exit at home), running the script locally,
# or waiting out what may be a site-side setting change - the abrupt start
# after months of green looks like one.

on:
  schedule:
    - cron: "42 9 * * 1" # Mondays 09:42 UTC - a weekly probe, not a nightly job, while
      # League of Comic Geeks blocks runner addresses (see the script header).
      # The first green run is the signal to put the nightly schedule back.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: comics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # sharp does the cover resizing and cheerio the parsing, so this needs
      # real dependencies rather than the bare Node runtime.
      - run: npm ci

      # No secret to guard on: this reads a public profile. The username comes
      # from `src/content/accounts.json`, so a rename is one edit there.
      - name: Read the comics from League of Comic Geeks
        run: node scripts/update-comics.mjs

      # `git status --porcelain` rather than `git diff`: a newly added comic
      # arrives as an untracked cover file, which `git diff` does not see at all
      # - so the first run of this job would have skipped its own commit.
      - name: Commit if the shelf moved
        run: |
          if [ -z "$(git status --porcelain -- src/content/comics.json public/img/comics)" ]; then
            echo "comics: unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- src/content/comics.json public/img/comics
          git commit -m "chore(comics): refresh the comic collection"
          git push
