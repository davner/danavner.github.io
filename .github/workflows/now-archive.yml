name: Now archive

# Files the previous now entry into `src/content/now/` when a new one replaces
# it, so that updating the page stays what it was: edit one file, push.
#
# `scripts/archive-now.mjs` decides whether anything is owed, by comparing the
# `updated` date of the version that just landed against the one before it. A new
# date means the old text was a finished entry and gets filed; the same date
# means it was a correction and nothing happens.
#
# The path filter is what stops this chasing its own tail. The job's commit only
# ever touches `src/content/now/`, never `src/content/now.md`, so it cannot
# trigger itself. It does trigger the deploy, which is the point - the archived
# entry has to reach the page.

on:
  push:
    branches: [main]
    paths:
      - "src/content/now.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: now-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      # Full history: the script reads the previous version of the page out of
      # it, which a shallow clone would not have.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # No `npm ci`. The script reads a file, runs `git`, and writes a file, so
      # the bare runtime is all it needs.
      - name: File the entry this one replaced
        run: node scripts/archive-now.mjs

      - name: Commit if something was filed
        run: |
          if [ -z "$(git status --porcelain -- src/content/now)" ]; then
            echo "now-archive: nothing filed, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- src/content/now
          git commit -m "chore(now): file the entry the latest update replaced"
          git push
