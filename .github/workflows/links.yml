name: External links

# External links rot for reasons that have nothing to do with a commit - a
# venue folds, a profile moves, a host starts refusing bots. Checking them on
# every push would mean a red build nobody can fix, so they get their own
# weekly run instead, and internal links stay in CI where they belong.
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check outbound links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Only the sources where human-facing URLs actually live. The built HTML
      # is not one of them: this is a single-page app, so dist/index.html holds
      # asset tags and nothing else, and its root-relative paths cannot be
      # resolved without a root dir. Internal links and assets are covered by
      # the Playwright suite in ci.yml, which checks them in a real browser.
      #
      # `[!_]*.md` rather than `*.md`, because a leading underscore marks a
      # file as notes-to-self rather than an entry - the same rule the content
      # plugin follows. Those files carry illustrative URLs ending in "...",
      # which are placeholders and were being reported as dead.
      - name: Check outbound links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # The excluded hosts all wall off an anonymous crawler rather than
          # answering it, so a result from them says nothing about whether the
          # link is any good:
          #
          #   linkedin, instagram, discogs,
          #   leagueofcomicgeeks, epicgames   403 outright
          #   setlist.fm                      serves a captcha page - and which
          #                                   status it uses depends on the
          #                                   user agent (202 for a browser
          #                                   string, 200 with a challenge body
          #                                   for a plain one), so leaving it in
          #                                   makes this job flaky rather than
          #                                   thorough
          #
          # The point is finding dead URLs, not fighting bot walls.
          # No `--exclude-mail`: it was removed in lychee 0.24, which is what
          # lychee-action@v2 pins, and an unknown flag exits 2 - which this job
          # reads as "links are broken" and files an issue about, every week,
          # whatever the links actually say. Mail addresses are skipped by
          # default now; `--include-mail` opts back in.
          args: >-
            --no-progress
            --max-retries 2
            --accept 200,206,429
            --exclude 'linkedin\.com'
            --exclude 'instagram\.com'
            --exclude 'discogs\.com'
            --exclude 'leagueofcomicgeeks\.com'
            --exclude 'store\.epicgames\.com'
            --exclude 'setlist\.fm'
            --exclude 'localhost'
            --exclude '127\.0\.0\.1'
            --exclude 'xxxxx'
            'README.md'
            'src/content/profile.ts'
            'src/content/**/[!_]*.md'
          fail: false
          output: lychee-report.md

      - name: Open an issue if anything is dead
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: Dead links found in the weekly check
          content-filepath: lychee-report.md
          labels: chore
