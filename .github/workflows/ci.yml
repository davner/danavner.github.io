name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ESLint and Prettier repeat what the pre-commit hook runs, because a hook
  # is a convenience rather than a gate: `--no-verify` skips it, and a commit
  # made anywhere but a machine that has run `npm install` never had it. The
  # three checks after them - actionlint, the admin-config schema and the
  # deploy trigger - run only here, since the files they guard are mostly
  # written outside any hook (the CMS commits via the GitHub API, and workflows
  # misfire rather than fail).
  lint:
    name: Lint and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

      # `--check` rather than `--write`. CI reporting that a file is misformatted
      # is useful; CI quietly reformatting it and carrying on is not.
      - name: Prettier
        run: npm run format:check

      # Nothing else checks the workflow files themselves - a typo'd expression
      # only surfaces when a workflow misfires. Pinned by version and checksum,
      # the same way the admin page pins its CMS script.
      - name: actionlint
        run: |
          curl -sSLo actionlint.tgz https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  actionlint.tgz" | sha256sum -c
          tar -xzf actionlint.tgz actionlint
          ./actionlint -color

      - name: Admin config schema
        run: npm run check:admin

      # A data workflow missing from `deploy.yml`'s `workflow_run` list commits
      # its data and never deploys it, with every run green. The coupling is a
      # bare string in one file matching a `name:` in another, which actionlint
      # does not cross-check.
      - name: Deploy triggers name every data workflow
        run: npm run check:workflows

  build:
    name: Type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Content lives in markdown and is validated in Node at build time, so a
      # malformed post or show fails right here rather than on the live site.
      #
      # `DANFM_SEED=1` builds `/dan-fm` from `src/content/dan-fm.seed.json` when
      # no fetched log is committed, so the suite below meets a populated page
      # instead of four empty boxes - the cursor, contrast, overflow and readout
      # sweeps all walk that route and none of them can see what is not rendered.
      # `deploy.yml` builds unseeded, so the fixture never reaches the live site,
      # and a real `dan-fm.json` wins over the seed wherever both exist.
      - name: Build
        run: DANFM_SEED=1 npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 1

  test:
    name: Behaviour, accessibility, and links
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Runs against the built site: behaviour, axe in both themes, internal
      # links, asset loading, and the no-third-party-requests guarantee.
      - name: Run Playwright
        run: npm test

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
