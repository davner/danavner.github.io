<!doctype html>
<html lang="en" class="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dan Avner</title>
    <meta
      name="description"
      content="Dan Avner builds production software for telescopes, observatories, and the astronomers who use them."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/img/me1.jpg" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      One rel=me per entry in `socials` in src/content/profile.ts - what
      Mastodon-style identity verification reads, and it reads the served HTML,
      never the app. Hand-written because the config context cannot import
      profile.ts (src/lib/routes.ts records why); tests/pages.spec.ts is what
      holds the two lists together.
    -->
    <link rel="me" href="https://github.com/davner" />
    <link rel="me" href="https://www.linkedin.com/in/danavner/" />
    <link rel="me" href="https://www.instagram.com/aspacemansheavyload/" />
    <link rel="me" href="https://www.youtube.com/@danmadespace" />
    <link rel="me" href="https://scholar.google.com/citations?user=B0HllkYAAAAJ&amp;hl=en" />

    <!--
      The home page's hero photo, which is its largest contentful paint. React
      renders it, so without this the browser cannot even see the URL until the
      bundle has parsed and run - measured at 1.5s of dead time on mobile before
      the request went out.

      `imagesizes` has to be the `sizes` the hero renders with in
      src/routes/home.tsx. A preload that disagrees picks a different candidate
      and the page fetches the photo twice.

      Marked so every generated page can drop it: this file is the only one
      GitHub Pages serves at "/", and preloading the home hero on /fortnite
      would be 47 kB nobody asked for. `vite-plugin-pages.ts` builds all of
      them from this file with the marked block taken out.
    -->
    <!-- home-preload:start -->
    <link
      rel="preload"
      as="image"
      href="/img/me1.webp"
      imagesrcset="/img/me1-768.webp 768w, /img/me1.webp 1067w"
      imagesizes="(min-width: 1024px) 384px, (min-width: 768px) 288px, 100vw"
      fetchpriority="high"
    />
    <!-- home-preload:end -->
    <meta name="theme-color" content="#0a0c12" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dan Avner" />
    <meta property="og:title" content="Dan Avner" />
    <meta
      property="og:description"
      content="Dan Avner builds production software for telescopes, observatories, and the astronomers who use them."
    />
    <meta property="og:url" content="https://danavner.com/" />
    <meta property="og:image" content="https://danavner.com/img/og-card.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Dan Avner - software, shows, and trips - at danavner.com"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <script>
      // Applied before first paint so the page never flashes the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark = stored ? stored === "dark" : prefersDark;
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          // The hex pair lives here and in THEME_COLOR in src/lib/theme.ts,
          // which this script cannot import. Dark is the shipped chrome value;
          // light is the newsprint background token.
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute("content", dark ? "#0a0c12" : "#f6f3ed");
        } catch (e) {
          /* localStorage unavailable - fall back to the dark default in the markup. */
        }
      })();
    </script>
  </head>
  <body>
    <!--
          * Segin

                             * Navi
                    * Ruchbah                       * Caph

                                          * Schedar

      Cassiopeia, plotted from its stars: right ascension increasing to the
      left, the way a chart draws the sky, and declination up the page.
      Circumpolar from here - the one constellation that never sets on this
      site.

      printed by danavner.com · source: github.com/davner/danavner.github.io
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
