name: dan.fm

# The album log is committed rather than fetched in the browser, for the same
# reasons the record collection is. The site's standing promise is that nothing
# phones home except the GoatCounter beacon, which `tests/links.spec.ts` asserts
# on every run. And the payload is validated at build time by
# `vite-plugin-content.ts`, which can only happen to a file in the repo.
#
# So this job is the only thing that reads the sheet: it fetches the published
# CSV, turns it into `src/content/dan-fm.json`, and commits it. A row the log
# cannot take fails the run and commits nothing, so the last good log stays and
# keeps showing. The push triggers the normal deploy, because `deploy.yml` names
# this workflow in its `workflow_run` list.

on:
  schedule:
    # 03:07 / 07:07 / 11:07 / 15:07 / 19:07 / 23:07 station-local in PDT.
    #
    # The hours are listed rather than written `*/4` on purpose. What the
    # schedule buys is how soon a newly logged album is on the page, and the
    # albums are typed in the evening: a run at 23:07 local catches the evening
    # it was logged, so a row added at eleven is deployed that night. `*/4` puts
    # the last evening run at 21:07 and leaves anything after it waiting for
    # 01:07. Both are four-hourly, so the worst case is the same four hours
    # either way - what differs is whether a run lands at the end of the day the
    # logging actually happens on. Do not tidy this back to `*/4`.
    #
    # These are UTC, so the station-local times shift an hour in PST: 02:07 /
    # 06:07 / 10:07 / 14:07 / 18:07 / 22:07, and the last evening run moves back
    # with them. Both are clear of vinyl (08:42), fortnite (09:17) and comics
    # (Mon 09:42) by at least 25 minutes. Scheduled runs drift under GitHub's
    # load, so that spacing is hygiene and the rebase below is the real
    # protection.
    - cron: "7 6,10,14,18,22,2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dan-fm
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # csv-parse does the parsing, so this needs real dependencies rather than
      # the bare Node runtime.
      - run: npm ci

      # The sheet is published to the web, so reading the log needs no secret.
      # Its URL comes from `src/content/accounts.json`, so re-publishing it is
      # one edit there.
      #
      # The Spotify pair buys the sleeves, and this step is deliberately not
      # guarded on it the way the vinyl job guards on its token. There, a
      # missing secret means a payload with half its fields stripped out, so
      # skipping is the safe read. Here it means the log is written with no new
      # cover art and every saved sleeve untouched, which is a working run - and
      # a guard would stop the log being read at all over an enhancement.
      - name: Read the album log from the sheet
        run: node scripts/update-dan-fm.mjs
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}

      # `git status --porcelain` rather than `git diff`, and the cover directory
      # named beside the log: a newly saved sleeve arrives as an untracked file,
      # which `git diff` does not see at all - so a run whose only change was
      # cover art would skip its own commit and fetch the same sleeves again
      # four hours later, forever.
      - name: Commit if the log moved
        run: |
          if [ -z "$(git status --porcelain -- src/content/dan-fm.json public/img/dan-fm)" ]; then
            echo "dan-fm: unchanged, nothing to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- src/content/dan-fm.json public/img/dan-fm
          git commit -m "chore(dan-fm): refresh the album log"

          # Eight scheduled pushes a day - vinyl, fortnite and this job's six -
          # and nine on the Monday the comics probe runs, so `main` moving under
          # this one is routine rather than exceptional. Each job commits a
          # disjoint set of paths, so the rebase itself cannot conflict and only
          # the ref moving can fail - which is what the retry answers. Three
          # attempts, then a red run, because a persistent failure is a real
          # signal.
          #
          # Never `--force-with-lease` here: a bot push that lands mid-rebase
          # has to fail this run rather than be overwritten.
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "dan-fm: main moved under the push, retrying ($attempt)"
          done
          exit 1
