<!doctype html>
<html lang="en" class="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dan Avner</title>
    <meta
      name="description"
      content="Dan Avner builds production software for telescopes, observatories, and the astronomers who use them."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/img/me1.jpg" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0a0c12" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dan Avner" />
    <meta property="og:title" content="Dan Avner" />
    <meta
      property="og:description"
      content="Dan Avner builds production software for telescopes, observatories, and the astronomers who use them."
    />
    <meta property="og:url" content="https://danavner.com/" />
    <meta property="og:image" content="https://danavner.com/img/me1.jpg" />
    <meta name="twitter:card" content="summary" />

    <script>
      // Applied before first paint so the page never flashes the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark = stored ? stored === "dark" : prefersDark;
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          /* localStorage unavailable - fall back to the dark default in the markup. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
