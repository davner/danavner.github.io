<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    /* Theme tokens resolved to hex - a favicon cannot read the page's custom
       properties. Dark is the default so a chrome that never reports a scheme
       gets the shipped plate; light repaints on newsprint with ink stars and
       the light theme's ember, gamut-mapped from oklch(0.53 0.22 30). */
    .plate { fill: #0d1017; }
    .star { fill: #e7e2d6; }
    .planet { fill: #e0a95c; }
    .orbit { stroke: #e0a95c; }
    @media (prefers-color-scheme: light) {
      .plate { fill: #f6f3ed; }
      .star { fill: #0b0d13; }
      .planet { fill: #ca0e00; }
      .orbit { stroke: #ca0e00; }
    }
  </style>
  <rect class="plate" width="32" height="32" rx="7" />
  <circle class="star" cx="9" cy="8" r="1" opacity="0.65" />
  <circle class="star" cx="24" cy="7" r="0.9" opacity="0.45" />
  <circle class="star" cx="20" cy="13" r="0.7" opacity="0.35" />
  <circle class="orbit" cx="16" cy="19" r="6.5" fill="none" stroke-width="2" />
  <circle class="planet" cx="16" cy="19" r="2" />
</svg>
