<!doctype html>
<html lang="en" class="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dan Avner</title>
    <meta
      name="description"
      content="Dan Avner builds production software for telescopes, observatories, and the astronomers who use them."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/img/me1.jpg" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0a0c12" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dan Avner" />
    <meta property="og:title" content="Dan Avner" />
    <meta
      property="og:description"
      content="Dan Avner builds production software for telescopes, observatories, and the astronomers who use them."
    />
    <meta property="og:url" content="https://danavner.com/" />
    <meta property="og:image" content="https://danavner.com/img/me1.jpg" />
    <meta name="twitter:card" content="summary" />

    <script>
      // Applied before first paint so the page never flashes the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark = stored ? stored === "dark" : prefersDark;
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          /* localStorage unavailable - fall back to the dark default in the markup. */
        }
      })();
    </script>

    <script>
      // The loading splash is a first-impression, not a toll booth: show it only
      // on the first page of a session, and never to automation (so it can never
      // flake a test). Font colours below are the theme's own oklch values,
      // hard-coded because the stylesheet that defines them has not loaded yet.
      (function () {
        var root = document.documentElement;
        if (navigator.webdriver) {
          root.classList.add("no-splash");
          return;
        }
        try {
          if (sessionStorage.getItem("seen-splash")) root.classList.add("no-splash");
          else sessionStorage.setItem("seen-splash", "1");
        } catch (e) {
          /* storage blocked - just show it */
        }
      })();
    </script>

    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: oklch(0.965 0.008 85);
        transition: opacity 0.45s ease;
      }
      .dark #splash {
        background: oklch(0.115 0.014 268);
      }
      #splash.is-hidden {
        opacity: 0;
        pointer-events: none;
      }
      .no-splash #splash {
        display: none;
      }
      .splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      .splash-hand {
        width: 92px;
        height: auto;
        overflow: visible;
      }
      .splash-hand g {
        fill: oklch(0.53 0.22 30);
        transform-box: fill-box;
        transform-origin: 50% 100%;
        animation: splash-rock 0.62s ease-in-out infinite;
      }
      .dark .splash-hand g {
        fill: oklch(0.66 0.225 32);
      }
      .splash-dots {
        display: flex;
        gap: 6px;
      }
      .splash-dots span {
        width: 5px;
        height: 5px;
        background: oklch(0.53 0.22 30);
        opacity: 0.25;
        animation: splash-blink 1.1s ease-in-out infinite;
      }
      .dark .splash-dots span {
        background: oklch(0.66 0.225 32);
      }
      .splash-dots span:nth-child(2) {
        animation-delay: 0.18s;
      }
      .splash-dots span:nth-child(3) {
        animation-delay: 0.36s;
      }
      @keyframes splash-rock {
        0%,
        100% {
          transform: rotate(-10deg);
        }
        50% {
          transform: rotate(10deg);
        }
      }
      @keyframes splash-blink {
        0%,
        100% {
          opacity: 0.2;
        }
        50% {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-hand g {
          animation: none;
        }
        .splash-dots span {
          animation: none;
          opacity: 0.6;
        }
        #splash {
          transition: opacity 0.2s ease;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading">
      <div class="splash-inner">
        <!-- A pixel sign of the horns, rocking out while the fonts load. -->
        <svg
          class="splash-hand"
          viewBox="0 0 12 16"
          shape-rendering="crispEdges"
          aria-hidden="true"
          focusable="false"
        >
          <g>
            <rect x="3" y="0" width="2" height="6" />
            <rect x="9" y="0" width="2" height="6" />
            <rect x="3" y="6" width="3" height="1" />
            <rect x="8" y="6" width="3" height="1" />
            <rect x="3" y="7" width="8" height="1" />
            <rect x="2" y="8" width="9" height="1" />
            <rect x="1" y="9" width="10" height="1" />
            <rect x="1" y="10" width="10" height="1" />
            <rect x="2" y="11" width="9" height="1" />
            <rect x="3" y="12" width="8" height="1" />
            <rect x="4" y="13" width="6" height="3" />
          </g>
        </svg>
        <div class="splash-dots" aria-hidden="true"><span></span><span></span><span></span></div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      // Set up dismissal now, so the splash can never hang: the app calls
      // __dismissSplash once fonts are ready and it has painted, and this hard
      // cap fires regardless if the bundle never gets that far.
      (function () {
        var splash = document.getElementById("splash");
        if (!splash) return;
        var done = false;
        window.__dismissSplash = function () {
          if (done) return;
          done = true;
          splash.classList.add("is-hidden");
          setTimeout(function () {
            if (splash.parentNode) splash.parentNode.removeChild(splash);
          }, 500);
        };
        setTimeout(window.__dismissSplash, 4000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
