name: Comics

# The comics are committed rather than fetched in the browser, for the same
# reasons as the record collection.
#
# The site's standing promise is that nothing phones home except the GoatCounter
# beacon, which `tests/links.spec.ts` asserts on every run, and a live call to
# League of Comic Geeks from the page would break it. The cover art is their CDN,
# not ours to lean on. And there is no API here at all - `scripts/update-comics.mjs`
# parses the same HTML the site's own front end asks for, which is not something
# to do from a visitor's browser even if the promise allowed it.
#
# So `scripts/update-comics.mjs` is the only thing that talks to League of Comic
# Geeks: it reads the collection, the pull list, and the wish list, writes
# `src/content/comics.json`, and saves the covers it had to download. A failed
# read writes nothing, so the last good payload stays and keeps showing.
#
# ## Why there is no nightly schedule
#
# There was one, and it never once worked. League of Comic Geeks is behind
# Cloudflare, which answers on how the client looks and where it is calling
# from. `impit` handles the first half - a plain `curl` gets 403 from anywhere
# and impit's browser fingerprint gets 200 - but a GitHub runner's datacenter
# address is exactly what Cloudflare distrusts, and nothing in the script can
# change that. Discogs has a real API and does not care, which is why that shelf
# updates from CI and this one cannot.
#
# It was tried properly before being given up on: the script retries a 403 three
# times with a widening gap, and a dispatched run failed all three. The refusal
# is about the address.
#
# So the shelf is refreshed by hand, the way `backfill-fortnite.mjs` is:
#
#   node scripts/update-comics.mjs
#
# then commit `src/content/comics.json` and `public/img/comics/`. This workflow
# stays dispatchable in case the block ever lifts, and would work unchanged if it
# did. What it will not do is run every night and go red every morning - a check
# nobody can act on is one everybody learns to scroll past.

# Dispatch only. There is no schedule, because a scheduled run here cannot work
# - see below.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: comics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # sharp does the cover resizing and cheerio the parsing, so this needs
      # real dependencies rather than the bare Node runtime.
      - run: npm ci

      # No secret to guard on: this reads a public profile. The username comes
      # from `src/content/accounts.json`, so a rename is one edit there.
      - name: Read the comics from League of Comic Geeks
        run: node scripts/update-comics.mjs

      # `git status --porcelain` rather than `git diff`: a newly added comic
      # arrives as an untracked cover file, which `git diff` does not see at all
      # - so the first run of this job would have skipped its own commit.
      - name: Commit if the shelf moved
        run: |
          if [ -z "$(git status --porcelain -- src/content/comics.json public/img/comics)" ]; then
            echo "comics: unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- src/content/comics.json public/img/comics
          git commit -m "chore(comics): refresh the comic collection"
          git push
